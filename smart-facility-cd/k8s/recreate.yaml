apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-facility
  namespace: prod
  labels:
    app: smart-facility
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: smart-facility
  template:
    metadata:
      labels:
        app: smart-facility
    spec:
      containers:
        - name: smart-facility
          image: ${IMAGE_URI}
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "${APP_VERSION}"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 400m
              memory: 384Mi
