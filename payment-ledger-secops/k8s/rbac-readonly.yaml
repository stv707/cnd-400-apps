apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-readonly
  namespace: prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sa-readonly-view
  namespace: prod
subjects:
  - kind: ServiceAccount
    name: sa-readonly
    namespace: prod
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
